# Infrastructure for local development: Postgres + Redis + RabbitMQ.
#
#   mvn spring-boot:run    # Spring Boot starts these services automatically (dev services)
#   docker compose up -d   # ...or start them manually
#   docker compose stop    # stop, keep containers and data
#   docker compose down    # remove containers (data stays in the volume)
#   docker compose down -v # remove containers and data
#
# The application itself is run locally (IDE / Maven), not in compose.
services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: postgress
      POSTGRES_PASSWORD: postgress
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: myuser
      RABBITMQ_DEFAULT_PASS: secret
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI (http://localhost:15672, myuser/secret)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  pgdata:
