# Run tests against the Docker Compose infrastructure (see compose.yaml).
# Spring Boot starts the containers and leaves them running so the database can
# be inspected after the test run. Stop them with `docker compose stop` or `docker compose down`.
spring.docker.compose.skip.in-tests=false
spring.docker.compose.lifecycle-management=start-only

# Schema + test data. The seed file lives on the test classpath only, so it is
# never packaged into the application jar and never applied to production.
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Publisher pollers are driven explicitly by tests; keep the schedules from ever firing.
wallet.outbox.initial-delay=1d
wallet.outbox.interval=1d
wallet.outbox.reclaim-interval=1d
