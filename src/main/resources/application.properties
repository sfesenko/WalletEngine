spring.application.name=WalletEngine

# gRPC server (Netty)
spring.grpc.server.port=9090

# SQL: the schema is owned by Flyway migrations, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# RabbitMQ: wallet events will be published with confirms enabled
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Outbox publisher: batch size, publish timeout, pause after a failed batch, poll intervals
wallet.outbox.batch-size=100
wallet.outbox.batch-publish-timeout=5s
wallet.outbox.retry-delay=1m
wallet.outbox.interval=5s
wallet.outbox.reclaim-interval=1h
wallet.outbox.processing-timeout=30m

# Strict idempotency:
#   false = save only successful transactions, request that returned error may be re-applied later
#   true = always store failed transaction_id, failed request cannot be re-applied
wallet.idempotency.strict=true
    