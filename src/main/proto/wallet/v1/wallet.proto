syntax = "proto3";

package wallet.v1;

option java_package = "com.github.walletengine.grpc.wallet.v1";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

service WalletService {

  rpc Debit(TransactionRequest) returns (TransactionResponse);

  rpc Credit(TransactionRequest) returns (TransactionResponse);

  rpc GetBalance(GetBalanceRequest) returns (WalletResponse);

  rpc CreateWallet(CreateWalletRequest) returns (WalletResponse);
}

message TransactionRequest {
  string transaction_id = 1; // UUID
  string wallet_id = 2;      // UUID
  int64 amount = 3;          // positive magnitude; the RPC decides the direction
}

message TransactionResponse {
  string transaction_id = 1; // UUID
  string wallet_id = 2;      // UUID
  optional int64 amount = 3; // wallet balance after the movement; a duplicate request returns the original snapshot
  google.protobuf.Timestamp updated_at = 4; // when the movement was recorded
  int64 transaction_amount = 5; //  positive = deposit, negative = withdrawal
}

message GetBalanceRequest {
  string wallet_id = 1; // UUID
}

message CreateWalletRequest {
  string wallet_id = 1; // UUID
}

message WalletResponse {
  string wallet_id = 1; // UUID
  optional int64 amount = 2; // explicit presence
  google.protobuf.Timestamp updated_at = 3;
}
